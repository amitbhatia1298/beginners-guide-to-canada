<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Six broad pathways to Canadian permanent residence</title><desc id="desc">A polished editorial infographic grouping Canada's immigration routes into economic, family, Quebec and protection pathways.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7f3eb"/><stop offset="1" stop-color="#e8f0ed"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#173b4c" flood-opacity=".12"/></filter></defs><rect width="1600" height="900" fill="url(#bg)"/>
<text x="100" y="112" fill="#bd493e" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">THE BIG PICTURE</text><text x="100" y="185" fill="#17394b" font-family="Georgia,serif" font-size="58" font-weight="700">Six routes. Different starting points.</text><text x="100" y="235" fill="#536c76" font-family="Arial,sans-serif" font-size="25">The right pathway depends on your circumstances and the program's current rules.</text>
<g filter="url(#s)"><rect x="100" y="310" width="660" height="220" rx="28" fill="#173f53"/><rect x="800" y="310" width="700" height="220" rx="28" fill="#fffdfa"/><rect x="100" y="570" width="660" height="220" rx="28" fill="#fffdfa"/><rect x="800" y="570" width="700" height="220" rx="28" fill="#e9d8c2"/></g>
<g font-family="Arial,sans-serif"><text x="150" y="375" fill="#e6bd7d" font-size="20" font-weight="700" letter-spacing="3">01 · ECONOMIC</text><text x="150" y="438" fill="#fffaf2" font-size="38" font-weight="700">Express Entry</text><text x="150" y="482" fill="#d7e4e5" font-size="24">Federal skilled-worker programs</text><text x="150" y="512" fill="#d7e4e5" font-size="24">and category-based selection.</text>
<text x="850" y="375" fill="#bd493e" font-size="20" font-weight="700" letter-spacing="3">02 · REGIONAL</text><text x="850" y="438" fill="#17394b" font-size="38" font-weight="700">Provincial nomination</text><text x="850" y="482" fill="#536c76" font-size="24">Provincial and territorial streams</text><text x="850" y="512" fill="#536c76" font-size="24">built around local priorities.</text>
<text x="150" y="635" fill="#bd493e" font-size="20" font-weight="700" letter-spacing="3">03 · FAMILY</text><text x="150" y="698" fill="#17394b" font-size="38" font-weight="700">Family sponsorship</text><text x="150" y="742" fill="#536c76" font-size="24">Eligible spouses, partners, children</text><text x="150" y="772" fill="#536c76" font-size="24">and certain other relatives.</text>
<text x="850" y="635" fill="#8e3b32" font-size="20" font-weight="700" letter-spacing="3">04 · OTHER SELECTION SYSTEMS</text><text x="850" y="698" fill="#17394b" font-size="38" font-weight="700">Quebec &amp; protection routes</text><text x="850" y="742" fill="#536c76" font-size="24">Quebec has its own selection system;</text><text x="850" y="772" fill="#536c76" font-size="24">refugee and humanitarian rules are distinct.</text></g>
<g transform="translate(1370 90)"><circle r="38" fill="#c9433b"/><path d="M0-24l8 15 18-4-9 15 11 13-18-1L0 35-7 18l-18-1 12-13-7-16 17 5z" fill="#fff8eb"/></g>
</svg>