<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Canada's main immigration pathways</title><desc id="d">Original BG2C infographic showing economic immigration, provincial nomination, family sponsorship, Quebec selection and humanitarian protection as distinct broad pathways.</desc><rect width="1600" height="1000" fill="#f5f1e8"/><text x="100" y="112" fill="#bd493e" font-family="Arial" font-size="21" font-weight="700" letter-spacing="5">THE BIG PICTURE</text><text x="100" y="190" fill="#17394b" font-family="Georgia" font-size="58" font-weight="700">Canada's immigration pathways</text><text x="100" y="245" fill="#536c76" font-family="Arial" font-size="25">Different routes serve different goals, backgrounds and eligibility requirements.</text><g><rect x="100" y="320" width="660" height="240" rx="26" fill="#173f53"/><rect x="800" y="320" width="700" height="240" rx="26" fill="#fffdfa"/><rect x="100" y="600" width="660" height="240" rx="26" fill="#fffdfa"/><rect x="800" y="600" width="700" height="240" rx="26" fill="#ead9c1"/></g><g font-family="Arial"><text x="155" y="390" fill="#e8bd78" font-size="20" font-weight="700" letter-spacing="3">01 · FEDERAL ECONOMIC</text><text x="155" y="455" fill="#fffaf2" font-size="40" font-weight="700">Express Entry</text><text x="155" y="505" fill="#d7e4e5" font-size="24">A federal system managing three</text><text x="155" y="538" fill="#d7e4e5" font-size="24">skilled immigration programs.</text><text x="855" y="390" fill="#bd493e" font-size="20" font-weight="700" letter-spacing="3">02 · PROVINCIAL / TERRITORIAL</text><text x="855" y="455" fill="#17394b" font-size="40" font-weight="700">Nominee programs</text><text x="855" y="505" fill="#536c76" font-size="24">Jurisdictions nominate candidates</text><text x="855" y="538" fill="#536c76" font-size="24">based on local program criteria.</text><text x="155" y="670" fill="#bd493e" font-size="20" font-weight="700" letter-spacing="3">03 · FAMILY</text><text x="155" y="735" fill="#17394b" font-size="40" font-weight="700">Family sponsorship</text><text x="155" y="785" fill="#536c76" font-size="24">Eligible relatives may sponsor</text><text x="155" y="818" fill="#536c76" font-size="24">qualifying family members.</text><text x="855" y="670" fill="#8e3b32" font-size="20" font-weight="700" letter-spacing="3">04 · DISTINCT ROUTES</text><text x="855" y="735" fill="#17394b" font-size="40" font-weight="700">Quebec &amp; protection</text><text x="855" y="785" fill="#536c76" font-size="24">Quebec has a separate selection system;</text><text x="855" y="818" fill="#536c76" font-size="24">refugee and humanitarian routes differ.</text><g transform="translate(1400 150)"><circle r="40" fill="#c94c43"/><path d="M0-25l8 16 18-4-9 16 12 14-19-1L0 36-8 17l-18-1 13-14-8-17 19 6z" fill="#fff8eb"/></g><text x="100" y="920" fill="#536c76" font-family="Arial" font-size="19">Always check the current official program criteria before applying.</text></svg>