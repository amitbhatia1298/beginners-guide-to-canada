<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Main immigration pathways to Canada</title><desc id="d">Six distinct pathways represented by connected cards: Express Entry, provincial nomination, Atlantic, family, Quebec, and humanitarian routes.</desc><rect width="1200" height="650" rx="28" fill="#eff8ff"/><text x="600" y="72" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#123b5d">CANADA'S MAIN IMMIGRATION PATHWAYS</text><path d="M600 335L205 205M600 335L600 205M600 335L995 205M600 335L205 485M600 335L600 485M600 335L995 485" stroke="#76a9ca" stroke-width="8" fill="none"/><circle cx="600" cy="335" r="95" fill="#d62828"/><path d="M600 272l16 31 36-8-18 30 24 27-38-2-20 35-14-35-38-1 25-26-14-34 34 11z" fill="#fff"/><g font-family="Arial" font-weight="700" text-anchor="middle"><g><rect x="65" y="130" width="280" height="150" rx="24" fill="#fff" stroke="#256b9b" stroke-width="4"/><text x="205" y="195" font-size="29" fill="#164e78">EXPRESS ENTRY</text><text x="205" y="235" font-size="20" fill="#466579">Federal skilled programs</text></g><g><rect x="460" y="130" width="280" height="150" rx="24" fill="#fff" stroke="#256b9b" stroke-width="4"/><text x="600" y="195" font-size="29" fill="#164e78">PNP</text><text x="600" y="235" font-size="20" fill="#466579">Provincial nomination</text></g><g><rect x="855" y="130" width="280" height="150" rx="24" fill="#fff" stroke="#256b9b" stroke-width="4"/><text x="995" y="195" font-size="29" fill="#164e78">ATLANTIC</text><text x="995" y="235" font-size="20" fill="#466579">Regional employer route</text></g><g><rect x="65" y="410" width="280" height="150" rx="24" fill="#fff" stroke="#256b9b" stroke-width="4"/><text x="205" y="475" font-size="29" fill="#164e78">FAMILY</text><text x="205" y="515" font-size="20" fill="#466579">Eligible family sponsorship</text></g><g><rect x="460" y="410" width="280" height="150" rx="24" fill="#fff" stroke="#256b9b" stroke-width="4"/><text x="600" y="475" font-size="29" fill="#164e78">QUEBEC</text><text x="600" y="515" font-size="20" fill="#466579">Separate selection system</text></g><g><rect x="855" y="410" width="280" height="150" rx="24" fill="#fff" stroke="#256b9b" stroke-width="4"/><text x="995" y="475" font-size="29" fill="#164e78">OTHER ROUTES</text><text x="995" y="515" font-size="20" fill="#466579">Protection &amp; special programs</text></g></g><text x="600" y="355" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#fff">PR</text></svg>