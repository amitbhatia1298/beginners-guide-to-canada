<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">PNP provinces and territories</title><desc id="d">Eleven provincial and territorial nominee jurisdictions: nine provinces other than Quebec, plus Yukon and Northwest Territories. Quebec has a separate selection system; Nunavut has no PNP.</desc><rect width="1200" height="700" rx="28" fill="#eff8ff"/><text x="600" y="65" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#123b5d">PROVINCIAL &amp; TERRITORIAL NOMINEE PROGRAMS</text><g font-family="Arial" font-weight="700" text-anchor="middle" fill="#145b85" font-size="25"><g fill="#fff" stroke="#2c7da8" stroke-width="4"><rect x="45" y="115" width="260" height="105" rx="18"/><rect x="330" y="115" width="260" height="105" rx="18"/><rect x="615" y="115" width="260" height="105" rx="18"/><rect x="900" y="115" width="260" height="105" rx="18"/><rect x="45" y="255" width="260" height="105" rx="18"/><rect x="330" y="255" width="260" height="105" rx="18"/><rect x="615" y="255" width="260" height="105" rx="18"/><rect x="900" y="255" width="260" height="105" rx="18"/><rect x="45" y="395" width="260" height="105" rx="18"/><rect x="330" y="395" width="260" height="105" rx="18"/><rect x="615" y="395" width="260" height="105" rx="18"/></g><text x="175" y="178">British Columbia</text><text x="460" y="178">Alberta</text><text x="745" y="178">Saskatchewan</text><text x="1030" y="178">Manitoba</text><text x="175" y="318">Ontario</text><text x="460" y="318">New Brunswick</text><text x="745" y="318">Nova Scotia</text><text x="1030" y="318">Prince Edward Island</text><text x="175" y="458">Newfoundland &amp; Labrador</text><text x="460" y="458">Yukon</text><text x="745" y="458">Northwest Territories</text></g><rect x="160" y="555" width="420" height="75" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><rect x="620" y="555" width="420" height="75" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><g font-family="Arial" font-size="22" font-weight="700" fill="#991b1b" text-anchor="middle"><text x="370" y="585">Quebec</text><text x="370" y="612" font-size="18">Separate economic selection system</text><text x="830" y="585">Nunavut</text><text x="830" y="612" font-size="18">No nominee program</text></g></svg>