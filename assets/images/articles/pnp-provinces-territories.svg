<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" role="img" aria-labelledby="t d"><title id="t">Canadian jurisdictions with Provincial Nominee Programs</title><desc id="d">Original BG2C infographic listing nine provinces other than Quebec and the two territories that operate nominee programs. Quebec has a separate selection system; Nunavut does not have a PNP.</desc><rect width="1600" height="1050" fill="#f6f2e9"/><text x="100" y="110" fill="#bd493e" font-family="Arial" font-size="21" font-weight="700" letter-spacing="5">A QUICK REFERENCE</text><text x="100" y="190" fill="#17394b" font-family="Georgia" font-size="58" font-weight="700">Where nominee programs operate</text><text x="100" y="245" fill="#536c76" font-family="Arial" font-size="24">Nine provinces and two territories have nominee programs.</text><rect x="100" y="310" width="1400" height="480" rx="28" fill="#fffdfa" stroke="#ded7cb" stroke-width="2"/><g fill="#173f53"><rect x="140" y="355" width="420" height="92" rx="15"/><rect x="590" y="355" width="420" height="92" rx="15"/><rect x="1040" y="355" width="420" height="92" rx="15"/><rect x="140" y="475" width="420" height="92" rx="15"/><rect x="590" y="475" width="420" height="92" rx="15"/><rect x="1040" y="475" width="420" height="92" rx="15"/><rect x="140" y="595" width="420" height="92" rx="15"/><rect x="590" y="595" width="420" height="92" rx="15"/><rect x="1040" y="595" width="420" height="92" rx="15"/></g><g fill="#fffaf2" font-family="Arial" font-size="25" font-weight="700" text-anchor="middle"><text x="350" y="413">British Columbia</text><text x="800" y="413">Alberta</text><text x="1250" y="413">Saskatchewan</text><text x="350" y="533">Manitoba</text><text x="800" y="533">Ontario</text><text x="1250" y="533">New Brunswick</text><text x="350" y="653">Nova Scotia</text><text x="800" y="653">Prince Edward Island</text><text x="1250" y="653">Newfoundland &amp; Labrador</text></g><rect x="100" y="840" width="680" height="125" rx="20" fill="#ead6b7"/><rect x="820" y="840" width="680" height="125" rx="20" fill="#f0dedb"/><g font-family="Arial"><text x="140" y="885" fill="#8e3b32" font-size="18" font-weight="700" letter-spacing="2">TERRITORIES WITH NOMINEE PROGRAMS</text><text x="140" y="930" fill="#17394b" font-size="25" font-weight="700">Yukon · Northwest Territories</text><text x="860" y="885" fill="#8e3b32" font-size="18" font-weight="700" letter-spacing="2">IMPORTANT EXCEPTIONS</text><text x="860" y="923" fill="#17394b" font-size="23" font-weight="700">Quebec: separate selection system</text><text x="860" y="952" fill="#536c76" font-size="20">Nunavut: no nominee program</text></g></svg>