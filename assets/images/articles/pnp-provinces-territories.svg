<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">PNP participation across Canada</title><desc id="d">A simplified, non-geographic list of participating provinces and territories, with Quebec and Nunavut clearly identified as not having PNPs.</desc><rect width="1200" height="650" rx="28" fill="#eff8ff"/><text x="600" y="70" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#123b5d">PNP PARTICIPATION ACROSS CANADA</text><g font-family="Arial" font-weight="700" text-anchor="middle"><g fill="#fff" stroke="#2c7da8" stroke-width="4"><rect x="55" y="125" width="330" height="105" rx="18"/><rect x="435" y="125" width="330" height="105" rx="18"/><rect x="815" y="125" width="330" height="105" rx="18"/><rect x="55" y="270" width="330" height="105" rx="18"/><rect x="435" y="270" width="330" height="105" rx="18"/><rect x="815" y="270" width="330" height="105" rx="18"/><rect x="55" y="415" width="330" height="105" rx="18"/><rect x="435" y="415" width="330" height="105" rx="18"/><rect x="815" y="415" width="330" height="105" rx="18"/></g><g fill="#145b85" font-size="27"><text x="220" y="188">British Columbia</text><text x="600" y="188">Alberta</text><text x="980" y="188">Saskatchewan</text><text x="220" y="333">Manitoba</text><text x="600" y="333">Ontario</text><text x="980" y="333">New Brunswick</text><text x="220" y="478">Nova Scotia</text><text x="600" y="478">Prince Edward Island</text><text x="980" y="478">Newfoundland &amp; Labrador</text></g></g><rect x="160" y="555" width="420" height="65" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><rect x="620" y="555" width="420" height="65" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><g font-family="Arial" font-size="22" font-weight="700" fill="#991b1b" text-anchor="middle"><text x="370" y="596">Quebec: separate selection system</text><text x="830" y="596">Nunavut: no PNP</text></g></svg>