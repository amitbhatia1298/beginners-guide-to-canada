<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Canadian provinces and territories with nominee programs</title><desc id="desc">An editorial reference graphic listing nine provinces and two territories with nominee programs, and distinguishing Quebec's separate system and Nunavut's lack of a PNP.</desc>
<rect width="1600" height="1000" fill="#f6f2e9"/><text x="100" y="105" fill="#bd493e" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="5">A QUICK REFERENCE</text><text x="100" y="180" fill="#17394b" font-family="Georgia,serif" font-size="58" font-weight="700">Where nominee programs operate</text><text x="100" y="230" fill="#536c76" font-family="Arial,sans-serif" font-size="24">Eleven provincial and territorial jurisdictions have nominee programs.</text>
<g font-family="Arial,sans-serif"><rect x="100" y="300" width="1400" height="420" rx="26" fill="#fffdfa" stroke="#ded7cb" stroke-width="2"/>
