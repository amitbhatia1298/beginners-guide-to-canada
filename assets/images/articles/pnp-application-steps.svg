<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" role="img" aria-labelledby="t d"><title id="t">Five stages in a Provincial Nominee Program application</title><desc id="d">Original BG2C process infographic: choose a province, check an eligible stream, apply for nomination, submit the federal permanent residence application, and complete IRCC checks.</desc><rect width="1600" height="950" fill="#f6f2e9"/><text x="100" y="110" fill="#bd493e" font-family="Arial" font-size="21" font-weight="700" letter-spacing="5">FROM RESEARCH TO APPLICATION</text><text x="100" y="190" fill="#17394b" font-family="Georgia" font-size="58" font-weight="700">The PNP process, step by step</text><text x="100" y="245" fill="#536c76" font-family="Arial" font-size="24">The exact sequence and portal depend on the provincial stream.</text><path d="M225 475H1375" stroke="#d8c9b4" stroke-width="13" stroke-linecap="round"/><g font-family="Arial" text-anchor="middle"><g><circle cx="225" cy="475" r="78" fill="#173f53"/><text x="225" y="492" fill="#fffaf2" font-size="46" font-weight="700">1</text><text x="225" y="600" fill="#17394b" font-size="28" font-weight="700">Choose a province</text><text x="225" y="655" fill="#536c76" font-size="21">Where you intend</text><text x="225" y="685" fill="#536c76" font-size="21">to settle</text></g><g><circle cx="512" cy="475" r="78" fill="#477d83"/><text x="512" y="492" fill="#fffaf2" font-size="46" font-weight="700">2</text><text x="512" y="600" fill="#17394b" font-size="28" font-weight="700">Check the stream</text><text x="512" y="655" fill="#536c76" font-size="21">Review eligibility,</text><text x="512" y="685" fill="#536c76" font-size="21">intake and criteria</text></g><g><circle cx="800" cy="475" r="78" fill="#bd493e"/><text x="800" y="492" fill="#fffaf2" font-size="46" font-weight="700">3</text><text x="800" y="600" fill="#17394b" font-size="28" font-weight="700">Apply for nomination</text><text x="800" y="655" fill="#536c76" font-size="21">Follow the province's</text><text x="800" y="685" fill="#536c76" font-size="21">application process</text></g><g><circle cx="1088" cy="475" r="78" fill="#477d83"/><text x="1088" y="492" fill="#fffaf2" font-size="46" font-weight="700">4</text><text x="1088" y="600" fill="#17394b" font-size="28" font-weight="700">Apply to IRCC</text><text x="1088" y="655" fill="#536c76" font-size="21">Submit the federal</text><text x="1088" y="685" fill="#536c76" font-size="21">PR application</text></g><g><circle cx="1375" cy="475" r="78" fill="#173f53"/><text x="1375" y="492" fill="#fffaf2" font-size="46" font-weight="700">5</text><text x="1375" y="600" fill="#17394b" font-size="28" font-weight="700">Complete checks</text><text x="1375" y="655" fill="#536c76" font-size="21">Respond to IRCC</text><text x="1375" y="685" fill="#536c76" font-size="21">requests and wait</text></g></g><rect x="100" y="790" width="1400" height="95" rx="20" fill="#ead6b7"/><text x="800" y="850" text-anchor="middle" fill="#17394b" font-family="Arial" font-size="25" font-weight="700">A provincial nomination is not PR approval. IRCC makes the final decision.</text></svg>