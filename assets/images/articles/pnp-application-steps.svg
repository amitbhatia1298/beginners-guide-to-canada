<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Five stages in a Provincial Nominee Program application</title><desc id="desc">A clear five-stage process: choose a province, confirm an eligible stream, apply for nomination, submit a federal permanent residence application, and complete IRCC checks.</desc>
<rect width="1600" height="900" fill="#f6f2e9"/><text x="100" y="105" fill="#bd493e" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="5">FROM RESEARCH TO APPLICATION</text><text x="100" y="180" fill="#17394b" font-family="Georgia,serif" font-size="58" font-weight="700">The PNP process, step by step</text><text x="100" y="230" fill="#536c76" font-family="Arial,sans-serif" font-size="24">The exact sequence and portal depend on the provincial stream you choose.</text>
<path d="M230 440H1370" stroke="#d5c7b3" stroke-width="12" stroke-linecap="round"/>
<g font-family="Arial,sans-serif" text-anchor="middle"><g><circle cx="230" cy="440" r="76" fill="#173f53"/><text x="230" y="456" fill="#fffaf2" font-size="45" font-weight="700">1</text><text x="230" y="565" fill="#17394b" font-size="27" font-weight="700">Choose a</text><text x="230" y="600" fill="#17394b" font-size="27" font-weight="700">province</text><text x="230" y="650" fill="#536c76" font-size="20">Where you genuinely</text><text x="230" y="678" fill="#536c76" font-size="20">intend to settle</text></g>
<g><circle cx="515" cy="440" r="76" fill="#477d83"/><text x="515" y="456" fill="#fffaf2" font-size="45" font-weight="700">2</text><text x="515" y="565" fill="#17394b" font-size="27" font-weight="700">Check the</text><text x="515" y="600" fill="#17394b" font-size="27" font-weight="700">right stream</text><text x="515" y="650" fill="#536c76" font-size="20">Eligibility, intake</text><text x="515" y="678" fill="#536c76" font-size="20">and route</text></g>
<g><circle cx="800" cy="440" r="76" fill="#bd493e"/><text x="800" y="456" fill="#fffaf2" font-size="45" font-weight="700">3</text><text x="800" y="565" fill="#17394b" font-size="27" font-weight="700">Apply for</text><text x="800" y="600" fill="#17394b" font-size="27" font-weight="700">nomination</text><text x="800" y="650" fill="#536c76" font-size="20">Follow the province's</text><text x="800" y="678" fill="#536c76" font-size="20">application process</text></g>
<g><circle cx="1085" cy="440" r="76" fill="#477d83"/><text x="1085" y="456" fill="#fffaf2" font-size="45" font-weight="700">4</text><text x="1085" y="565" fill="#17394b" font-size="27" font-weight="700">Apply to IRCC</text><text x="1085" y="600" fill="#17394b" font-size="27" font-weight="700">for PR</text><text x="1085" y="650" fill="#536c76" font-size="20">Use the correct federal</text><text x="1085" y="678" fill="#536c76" font-size="20">application route</text></g>
<g><circle cx="1370" cy="440" r="76" fill="#173f53"/><text x="1370" y="456" fill="#fffaf2" font-size="45" font-weight="700">5</text><text x="1370" y="565" fill="#17394b" font-size="27" font-weight="700">Complete</text><text x="1370" y="600" fill="#17394b" font-size="27" font-weight="700">IRCC checks</text><text x="1370" y="650" fill="#536c76" font-size="20">Respond to requests</text><text x="1370" y="678" fill="#536c76" font-size="20">and await a decision</text></g></g>
<rect x="100" y="760" width="1400" height="82" rx="18" fill="#ead6b7"/><text x="800" y="811" text-anchor="middle" fill="#17394b" font-family="Arial,sans-serif" font-size="24" font-weight="700">A provincial nomination is not PR approval. IRCC makes the final decision.</text>
</svg>