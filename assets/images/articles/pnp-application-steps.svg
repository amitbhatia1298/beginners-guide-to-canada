<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">PNP application process</title><desc id="d">Five stages: choose a province, check a stream, apply for nomination, submit the federal PR application, and complete IRCC checks.</desc><rect width="1200" height="500" rx="28" fill="#f1f8fc"/><text x="600" y="65" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#123b5d">THE PNP PROCESS: FIVE BIG STAGES</text><path d="M170 240H1030" stroke="#8bbbd5" stroke-width="12" stroke-linecap="round"/><g font-family="Arial" text-anchor="middle"><g><circle cx="150" cy="240" r="72" fill="#145b85"/><text x="150" y="255" fill="#fff" font-size="42" font-weight="700">1</text><text x="150" y="355" fill="#123b5d" font-size="23" font-weight="700">Choose a</text><text x="150" y="385" fill="#123b5d" font-size="23" font-weight="700">province</text></g><g><circle cx="375" cy="240" r="72" fill="#267ca6"/><text x="375" y="255" fill="#fff" font-size="42" font-weight="700">2</text><text x="375" y="355" fill="#123b5d" font-size="23" font-weight="700">Check the</text><text x="375" y="385" fill="#123b5d" font-size="23" font-weight="700">right stream</text></g><g><circle cx="600" cy="240" r="72" fill="#d62828"/><text x="600" y="255" fill="#fff" font-size="42" font-weight="700">3</text><text x="600" y="355" fill="#123b5d" font-size="23" font-weight="700">Apply for</text><text x="600" y="385" fill="#123b5d" font-size="23" font-weight="700">nomination</text></g><g><circle cx="825" cy="240" r="72" fill="#267ca6"/><text x="825" y="255" fill="#fff" font-size="42" font-weight="700">4</text><text x="825" y="355" fill="#123b5d" font-size="23" font-weight="700">Apply to IRCC</text><text x="825" y="385" fill="#123b5d" font-size="23" font-weight="700">for PR</text></g><g><circle cx="1050" cy="240" r="72" fill="#145b85"/><text x="1050" y="255" fill="#fff" font-size="42" font-weight="700">5</text><text x="1050" y="355" fill="#123b5d" font-size="23" font-weight="700">Complete</text><text x="1050" y="385" fill="#123b5d" font-size="23" font-weight="700">IRCC checks</text></g></g><text x="600" y="455" text-anchor="middle" font-family="Arial" font-size="19" fill="#466579">A nomination is not permanent residence approval; IRCC makes the final decision.</text></svg>