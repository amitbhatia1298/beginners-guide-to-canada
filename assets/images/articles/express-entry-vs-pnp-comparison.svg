<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Express Entry versus Provincial Nominee Program</title><desc id="d">Original BG2C comparison infographic contrasting federal Express Entry selection with province-led nominee streams and explaining the 600 CRS points for an eligible Express Entry-linked nomination.</desc><rect width="1600" height="900" fill="#f6f2e9"/><text x="100" y="110" fill="#bd493e" font-family="Arial" font-size="21" font-weight="700" letter-spacing="5">UNDERSTANDING THE DIFFERENCE</text><text x="100" y="190" fill="#17394b" font-family="Georgia" font-size="60" font-weight="700">Express Entry vs. PNP</text><rect x="100" y="270" width="650" height="420" rx="28" fill="#173f53"/><rect x="850" y="270" width="650" height="420" rx="28" fill="#fffdfa" stroke="#d9d1c4" stroke-width="2"/><g font-family="Arial"><text x="155" y="350" fill="#e8bd78" font-size="20" font-weight="700" letter-spacing="3">FEDERAL SYSTEM</text><text x="155" y="420" fill="#fffaf2" font-size="44" font-weight="700">Express Entry</text><path d="M155 455H695" stroke="#557486" stroke-width="2"/><text x="155" y="520" fill="#fffaf2" font-size="25">• Manages three federal skilled programs</text><text x="155" y="575" fill="#fffaf2" font-size="25">• Ranks eligible profiles using CRS</text><text x="155" y="630" fill="#fffaf2" font-size="25">• IRCC issues invitations to apply</text><text x="905" y="350" fill="#bd493e" font-size="20" font-weight="700" letter-spacing="3">PROVINCE / TERRITORY LED</text><text x="905" y="420" fill="#17394b" font-size="44" font-weight="700">PNP</text><path d="M905 455H1445" stroke="#e4ddd2" stroke-width="2"/><text x="905" y="520" fill="#314e5a" font-size="25">• Jurisdictions set their own streams</text><text x="905" y="575" fill="#314e5a" font-size="25">• Criteria vary by program</text><text x="905" y="630" fill="#314e5a" font-size="25">• Some streams align with Express Entry</text></g><rect x="100" y="740" width="1400" height="105" rx="22" fill="#ead6b7"/><circle cx="170" cy="792" r="29" fill="#bd493e"/><path d="M170 770l8 15 17-4-9 15 11 12-17-1-10 16-8-16-17-1 11-12-7-15 16 5z" fill="#fff8eb"/><text x="225" y="785" fill="#17394b" font-family="Arial" font-size="28" font-weight="700">600 additional CRS points</text><text x="225" y="822" fill="#536c76" font-family="Arial" font-size="21">An eligible Express Entry-aligned provincial nomination adds 600 points.</text></svg>