<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
<title id="title">Express Entry versus Provincial Nominee Program</title><desc id="desc">Side-by-side comparison of federal Express Entry and provincial nominee streams, with a highlighted note that a valid Express Entry-aligned nomination adds 600 CRS points.</desc>
<rect width="1600" height="850" fill="#f6f2e9"/><text x="100" y="105" fill="#bd493e" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="5">UNDERSTANDING THE DIFFERENCE</text><text x="100" y="178" fill="#17394b" font-family="Georgia,serif" font-size="58" font-weight="700">Express Entry vs. PNP</text>
<rect x="100" y="245" width="650" height="390" rx="28" fill="#173f53"/><rect x="850" y="245" width="650" height="390" rx="28" fill="#fffdfa" stroke="#d9d1c4" stroke-width="2"/>
<g font-family="Arial,sans-serif"><text x="155" y="320" fill="#e6bd7d" font-size="20" font-weight="700" letter-spacing="3">FEDERAL SYSTEM</text><text x="155" y="382" fill="#fffaf2" font-size="42" font-weight="700">Express Entry</text><path d="M155 415H695" stroke="#557486" stroke-width="2"/><text x="155" y="475" fill="#fffaf2" font-size="25">• Manages three federal skilled programs</text><text x="155" y="525" fill="#fffaf2" font-size="25">• Ranks eligible candidates using CRS</text><text x="155" y="575" fill="#fffaf2" font-size="25">• IRCC issues invitations to apply</text>
<text x="905" y="320" fill="#bd493e" font-size="20" font-weight="700" letter-spacing="3">PROVINCE / TERRITORY LED</text><text x="905" y="382" fill="#17394b" font-size="42" font-weight="700">PNP</text><path d="M905 415H1445" stroke="#e4ddd2" stroke-width="2"/><text x="905" y="475" fill="#314e5a" font-size="25">• Each jurisdiction sets its own streams</text><text x="905" y="525" fill="#314e5a" font-size="25">• Criteria and intake vary by stream</text><text x="905" y="575" fill="#314e5a" font-size="25">• Some streams align with Express Entry</text></g>
<rect x="100" y="685" width="1400" height="105" rx="22" fill="#ead6b7"/><circle cx="170" cy="737" r="29" fill="#bd493e"/><path d="M170 715l7 14 16-3-8 13 10 11-16-1-9 15-7-15-16-1 10-11-6-14 15 4z" fill="#fff8eb"/><text x="225" y="725" fill="#17394b" font-family="Arial,sans-serif" font-size="27" font-weight="700">600 additional CRS points</text><text x="225" y="763" fill="#536c76" font-family="Arial,sans-serif" font-size="22">A valid nomination through an eligible Express Entry-aligned stream can add 600 points.</text>
</svg>