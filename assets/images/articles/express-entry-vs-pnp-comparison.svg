<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Express Entry and PNP compared</title><desc id="d">A side-by-side comparison explaining federal Express Entry selection and province-led PNP selection, with a note that an eligible Express Entry-linked nomination adds 600 CRS points.</desc><rect width="1200" height="560" rx="28" fill="#f3f8fc"/><text x="600" y="70" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#123b5d">EXPRESS ENTRY vs. PNP</text><rect x="70" y="120" width="500" height="330" rx="24" fill="#fff" stroke="#2d83b5" stroke-width="5"/><rect x="630" y="120" width="500" height="330" rx="24" fill="#fff" stroke="#d62828" stroke-width="5"/><rect x="70" y="120" width="500" height="78" rx="20" fill="#145b85"/><rect x="630" y="120" width="500" height="78" rx="20" fill="#b91c1c"/><g font-family="Arial" text-anchor="middle" fill="#fff" font-weight="700" font-size="30"><text x="320" y="170">EXPRESS ENTRY</text><text x="880" y="170">PROVINCIAL NOMINEE</text></g><g font-family="Arial" fill="#23465d" font-size="25"><text x="115" y="255">• Federal selection system</text><text x="115" y="310">• CRS ranking and invitations</text><text x="115" y="365">• Three federal skilled programs</text><text x="675" y="255">• Province/territory-led streams</text><text x="675" y="310">• Rules vary by jurisdiction</text><text x="675" y="365">• Some streams align with Express Entry</text></g><rect x="280" y="475" width="640" height="58" rx="18" fill="#fff0c2" stroke="#e2a928" stroke-width="3"/><text x="600" y="513" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#65420a">Eligible Express Entry-linked nomination: +600 CRS points</text></svg>