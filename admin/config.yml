backend:
  name: github
  repo: amitbhatia1298/beginners-guide-to-canada
  branch: main
  base_url: "https://bg2c-github-auth.amitbhatia1298.workers.dev"
  auth_endpoint: auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://beginnersguidetocanada.ca
display_url: https://beginnersguidetocanada.ca

collections:
  - name: "articles"
    label: "Articles"
    folder: "content/articles"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Publish Date"
        name: "date"
        widget: "datetime"
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Immigration & Permanent Residence"
          - "Work & Careers"
          - "Study in Canada"
          - "Visit Canada"
          - "Canadian Citizenship"
          - "Housing & Real Estate"
          - "Banking, Finance & Taxes"
          - "Healthcare & Insurance"
          - "Life in Canada"
          - "Provinces & Territories"
      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false
      - label: "Summary"
        name: "description"
        widget: "text"
      - label: "Article Content"
        name: "body"
        widget: "markdown"
